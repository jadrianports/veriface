[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veriface"
version = "0.1.0"
description = "Open-set face recognition + presentation-attack detection for Python. CPU-only, ONNX Runtime, pip install-able."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "huggingface-hub>=1.27,<2",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "typer>=0.27,<1",
  "onnxruntime>=1.28,<2",
  "opencv-python-headless>=5,<6",
  "structlog",
  "httpx>=0.28,<1",
]

[project.scripts]
veriface = "veriface.cli:app"

[project.optional-dependencies]
server = []
# LFW fetch/extraction, the manifest sampler, and tier config use only
# httpx/pydantic/typer (already core deps) plus stdlib tarfile/csv/hashlib.
# `gdown` (plan 01-07) is the first genuinely eval-only dependency, admitted
# through a blocking package-legitimacy checkpoint (see 01-07-SUMMARY.md) —
# it makes `_try_mount`'s ModuleNotFoundError guard in
# `veriface/cli/__init__.py` structurally meaningful: `veriface data` now
# raises a clear ImportError, not a silent import, when installed without
# this extra (verified live in 01-07, closing 01-04's D5 coverage gap).
eval = [
    "gdown>=6.1.0",
]
demo = []

[tool.hatch.build.targets.wheel]
packages = ["src/veriface", "src/veriface_server", "src/veriface_eval"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Tests favor readability over exhaustive annotations; fixture parameters
# rarely benefit from an explicit type at the call site.
"tests/**" = ["ANN"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "onnxruntime.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gdown.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires network access and cached/downloadable model artifacts",
]

[tool.coverage.run]
source = ["src"]

# Measured 71% on `pytest tests/unit --cov=src` (two consecutive runs agreed,
# 2026-08-08), rounded down to the nearest 5% per D-30 — a real number, not a
# ratcheting gate or an aspirational target. Same scope and threshold as the
# CI `unit` job's `--cov-fail-under`; both must move together. Uncovered
# remainder is concentrated in network-touching code paths (artifact
# download/verify, dataset fetch, CLI command bodies) that the integration
# suite exercises instead — see 01-08-SUMMARY.md for the module breakdown.
[tool.coverage.report]
fail_under = 70

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]
